<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>客户咨询后台｜Jing Chen Homes</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --green:#1e3d2d;--green2:#12291e;--ink:#25231f;--ivory:#f5f2ea;--ivory2:#ebe5da;
  --gold:#b49a55;--muted:#8f8a80;--line:rgba(37,35,31,.14);--white:#fff;
  --shadow:0 24px 70px rgba(20,31,25,.12);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--ivory);color:var(--ink);min-height:100vh;
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.topbar{background:var(--green);color:#fff;padding:20px 0}
.topbar-inner{width:min(1100px,calc(100% - 40px));margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-family:"Noto Serif SC","Songti SC",serif;font-size:20px;letter-spacing:.02em}
.brand small{display:block;font-size:11px;letter-spacing:.14em;opacity:.7;margin-top:4px;font-family:"Noto Sans SC",sans-serif}
.logout-btn{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;padding:9px 16px;font-size:13px;cursor:pointer;border-radius:2px}
.logout-btn:hover{background:rgba(255,255,255,.12)}
.wrap{width:min(1100px,calc(100% - 40px));margin:40px auto 80px}

/* login */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{background:#fff;box-shadow:var(--shadow);padding:44px 40px;width:100%;max-width:380px;border-top:3px solid var(--gold)}
.login-title{font-family:"Noto Serif SC","Songti SC",serif;font-size:24px;margin:0 0 6px}
.login-sub{color:var(--muted);font-size:13px;margin:0 0 28px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;letter-spacing:.03em}
.field input{width:100%;padding:12px 14px;border:1px solid var(--line);background:var(--ivory);font-size:14px;color:var(--ink)}
.field input:focus{outline:2px solid var(--green);outline-offset:1px}
.login-btn{width:100%;padding:13px;background:var(--green);color:#fff;border:0;font-size:14px;letter-spacing:.03em;cursor:pointer;margin-top:8px}
.login-btn:hover{background:var(--green2)}
.login-btn:disabled{opacity:.6;cursor:default}
.login-error{color:#a33;font-size:13px;margin-top:14px;display:none}

/* table */
.panel-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:22px}
.panel-title{font-family:"Noto Serif SC","Songti SC",serif;font-size:26px;margin:0}
.panel-count{color:var(--muted);font-size:13px}
.refresh-btn{border:1px solid var(--green);color:var(--green);background:transparent;padding:8px 14px;font-size:13px;cursor:pointer}
.refresh-btn:hover{background:var(--green);color:#fff}
.table-wrap{background:#fff;box-shadow:var(--shadow);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px;font-size:13.5px}
th,td{text-align:left;padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--ivory2);color:var(--ink);font-weight:600;font-size:12px;letter-spacing:.04em;white-space:nowrap}
tr:last-child td{border-bottom:none}
td.msg{max-width:260px;white-space:pre-wrap;color:#4a463f}
td.empty-cell{color:var(--muted)}
.badge{display:inline-block;padding:3px 9px;font-size:11px;background:var(--ivory2);color:var(--green)}
.state-msg{padding:60px 20px;text-align:center;color:var(--muted)}
</style>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <p class="login-title">客户咨询后台</p>
    <p class="login-sub">Jing Chen Homes · 登录查看网站留资</p>
    <form id="loginForm">
      <div class="field">
        <label for="email">邮箱</label>
        <input id="email" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="login-btn" id="loginBtn" type="submit">登录</button>
      <p class="login-error" id="loginError">邮箱或密码不对，请再试一次。</p>
    </form>
  </div>
</div>

<div id="dashScreen" style="display:none">
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">Jing Chen Homes<small>客户咨询后台</small></div>
      <button class="logout-btn" id="logoutBtn">退出登录</button>
    </div>
  </div>
  <div class="wrap">
    <div class="panel-head">
      <div>
        <p class="panel-title">网站客户咨询</p>
        <p class="panel-count" id="countLabel">加载中…</p>
      </div>
      <button class="refresh-btn" id="refreshBtn">刷新</button>
    </div>
    <div class="table-wrap" id="tableWrap">
      <div class="state-msg">加载中…</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../config.js"></script>
<script>
const sb = window.supabase.createClient(window.CONFIG.SUPABASE_URL, window.CONFIG.SUPABASE_ANON_KEY);

const loginScreen = document.getElementById('loginScreen');
const dashScreen = document.getElementById('dashScreen');
const loginForm = document.getElementById('loginForm');
const loginBtn = document.getElementById('loginBtn');
const loginError = document.getElementById('loginError');
const tableWrap = document.getElementById('tableWrap');
const countLabel = document.getElementById('countLabel');

function fmtDate(iso){
  try{
    const d = new Date(iso);
    return d.toLocaleString('zh-CN', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  }catch(e){ return iso; }
}
function esc(s){
  if(s === null || s === undefined || s === '') return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function showDashboard(){
  loginScreen.style.display = 'none';
  dashScreen.style.display = 'block';
  await loadLeads();
}

async function loadLeads(){
  tableWrap.innerHTML = '<div class="state-msg">加载中…</div>';
  const { data, error } = await sb
    .from('leads')
    .select('*')
    .order('created_at', { ascending: false });

  if(error){
    tableWrap.innerHTML = '<div class="state-msg">加载失败：' + esc(error.message) + '</div>';
    countLabel.textContent = '';
    return;
  }

  countLabel.textContent = '共 ' + data.length + ' 条咨询';

  if(data.length === 0){
    tableWrap.innerHTML = '<div class="state-msg">目前还没有客户提交咨询。</div>';
    return;
  }

  let rows = data.map(r => `
    <tr>
      <td>${fmtDate(r.created_at)}</td>
      <td>${esc(r.name) || '<span class="empty-cell">—</span>'}</td>
      <td>${esc(r.phone) || '<span class="empty-cell">—</span>'}</td>
      <td>${esc(r.email) || '<span class="empty-cell">—</span>'}</td>
      <td>${r.intent ? '<span class="badge">'+esc(r.intent)+'</span>' : '<span class="empty-cell">—</span>'}</td>
      <td class="msg">${esc(r.message) || '<span class="empty-cell">—</span>'}</td>
    </tr>
  `).join('');

  tableWrap.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>提交时间</th><th>姓名</th><th>电话</th><th>邮箱</th><th>意向</th><th>留言</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  loginError.style.display = 'none';
  loginBtn.disabled = true;
  loginBtn.textContent = '登录中…';
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  const { error } = await sb.auth.signInWithPassword({ email, password });

  loginBtn.disabled = false;
  loginBtn.textContent = '登录';

  if(error){
    loginError.style.display = 'block';
    return;
  }
  showDashboard();
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await sb.auth.signOut();
  dashScreen.style.display = 'none';
  loginScreen.style.display = 'flex';
  document.getElementById('password').value = '';
});

document.getElementById('refreshBtn').addEventListener('click', loadLeads);

// 如果之前登录过还没退出，自动直接进后台
sb.auth.getSession().then(({ data }) => {
  if(data.session){
    showDashboard();
  }
});
</script>
</body>
</html>
